name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Fix Gradle Flutter SDK path
        run: |
          FLUTTER_SDK_PATH=$(flutter sdk-path)
          sed -i "s|.*flutter.sdk.*|def localProperties = new Properties()\nlocalProperties.setProperty('flutter.sdk', '$FLUTTER_SDK_PATH')|" android/local.properties
          echo "Fixed flutter.sdk path to: $FLUTTER_SDK_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
